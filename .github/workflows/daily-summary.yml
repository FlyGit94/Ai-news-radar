name: Daily Horizon Summary

on:
  # schedule:
    # 北京时间每周一早上 06:30 触发（UTC 周日 22:30）
  #  - cron: '30 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install Python dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon --hours 24

      - name: Commit generated summaries
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/public/data/raw/
          git commit -m "chore: add weekly summary $(date +%Y-%m-%d)" || echo "no changes to commit"
          git push

name: 每日维C提醒

on:
  schedule:
    # UTC 时间 05:00 = 北京时间 13:00
    # 但为了更精准，我们用 cron 探测 + 时间门卫双重保险
    - cron: '0 5 * * *'
    # 再加一个备用探测，防止第一次触发失败（比如 GitHub 队列延迟）
    - cron: '5 5 * * *'
  workflow_dispatch:  # 保留手动触发，方便测试

jobs:
  # 1. 时间门卫：确认是否真的是北京时间 13:00
  gate:
    name: 确认北京时间 13:00
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: 判断当前是否为目标时间
        id: check
        env:
          REPORT_TZ: 'Asia/Shanghai'  # 使用北京时间
        run: |
          set -euo pipefail

          # 获取北京时间的当前小时和分钟
          NOW_HOUR=$(TZ="$REPORT_TZ" date +%-H)
          NOW_MINUTE=$(TZ="$REPORT_TZ" date +%-M)
          NOW_PRINT=$(TZ="$REPORT_TZ" date '+%Y-%m-%d %H:%M %Z')

          echo "当前北京时间: $NOW_PRINT (小时=$NOW_HOUR, 分钟=$NOW_MINUTE)"

          # 目标时间：13:00（允许前后 5 分钟误差，应对 GitHub 的 cron 延迟）
          TARGET_HOUR=13
          TARGET_MINUTE_START=0   # 允许 13:00 到 13:05
          TARGET_MINUTE_END=5

          # 判断是否在目标时间窗口内
          if [ "$NOW_HOUR" -eq "$TARGET_HOUR" ] && [ "$NOW_MINUTE" -ge "$TARGET_MINUTE_START" ] && [ "$NOW_MINUTE" -le "$TARGET_MINUTE_END" ]; then
            echo "✓ 匹配！北京时间 13:00-13:05，执行提醒。"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ 不在发送窗口内，跳过本次触发。"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. 发送消息：仅在门卫放行时执行
  send-reminder:
    name: 发送维C提醒
    needs: gate
    if: needs.gate.outputs.should-run == 'true'  # 只有门卫放行才执行
    runs-on: ubuntu-latest
    
    steps:
      # 使用现成的 Pushover Action，不需要拉取代码
      - name: 发送 Pushover 通知
        uses: umahmood/pushover-actions@main
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        with:
          message: '主人～该吃维C啦！您健康的样子最好了 🌞'
          title: '🧐 主人，维C时间'
          # 可选：添加声音提醒
          sound: 'pushover'
